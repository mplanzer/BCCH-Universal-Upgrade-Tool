name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  powershell:
    name: Validate (${{ matrix.shell }})
    runs-on: windows-2025
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check PowerShell syntax
        run: |
          $ErrorActionPreference = 'Stop'
          $Scripts = @(git ls-files -- '*.ps1')
          if ($LASTEXITCODE -ne 0) {
              throw 'Could not enumerate tracked PowerShell scripts.'
          }
          if ($Scripts.Count -eq 0) {
              throw 'No tracked PowerShell scripts were found.'
          }
          foreach ($Script in $Scripts) {
              $Tokens = $null
              $ParseErrors = $null
              $null = [System.Management.Automation.Language.Parser]::ParseFile(
                  (Join-Path $PWD $Script), [ref]$Tokens, [ref]$ParseErrors)
              if ($ParseErrors.Count -gt 0) {
                  throw ($ParseErrors | Out-String)
              }
              Write-Host "Syntax OK: $Script"
          }

      - name: Run offline regression tests
        run: |
          $ErrorActionPreference = 'Stop'
          .\Test-Update.ps1
